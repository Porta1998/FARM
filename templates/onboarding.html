<!DOCTYPE html>

<html class="light" lang="it"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-surface": "#2f3430",
              "outline-variant": "#afb3ae",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f4f4f0",
              "error-dim": "#5c1202",
              "inverse-surface": "#0d0f0d",
              "surface": "#faf9f6",
              "surface-container-highest": "#e0e4de",
              "on-tertiary-container": "#585e4e",
              "surface-dim": "#d6dbd5",
              "primary-fixed-dim": "#b8deb6",
              "background": "#faf9f6",
              "tertiary-fixed": "#f1f6e1",
              "on-secondary-fixed": "#394237",
              "on-tertiary-fixed-variant": "#636858",
              "on-primary": "#e4ffe0",
              "surface-tint": "#456646",
              "secondary-fixed": "#dbe5d7",
              "tertiary-dim": "#505545",
              "on-secondary": "#f2fced",
              "primary-dim": "#395a3b",
              "primary-fixed": "#c6edc4",
              "error": "#9e422c",
              "on-surface-variant": "#5c605c",
              "surface-container": "#edeeea",
              "secondary-container": "#dbe5d7",
              "on-secondary-container": "#4b5449",
              "on-primary-container": "#38593a",
              "on-error": "#fff7f6",
              "secondary": "#586256",
              "error-container": "#fe8b70",
              "on-primary-fixed": "#264629",
              "tertiary-fixed-dim": "#e3e8d3",
              "inverse-on-surface": "#9d9d9a",
              "outline": "#777c77",
              "secondary-fixed-dim": "#cdd7c9",
              "on-tertiary": "#f6fbe6",
              "on-error-container": "#742410",
              "surface-variant": "#e0e4de",
              "tertiary-container": "#f1f6e1",
              "on-secondary-fixed-variant": "#555e53",
              "on-primary-fixed-variant": "#426344",
              "on-tertiary-fixed": "#464c3c",
              "primary": "#456646",
              "inverse-primary": "#d7fed4",
              "surface-container-high": "#e6e9e4",
              "surface-bright": "#faf9f6",
              "primary-container": "#c6edc4",
              "on-background": "#2f3430",
              "secondary-dim": "#4c564b",
              "tertiary": "#5c6151"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .text-glow {
            text-shadow: 0 0 40px rgba(69, 102, 70, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-between selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation Anchor (Shared Component Suppression Applied: Task-Focused Flow) -->
<header class="w-full flex justify-center pt-16 pb-8">
<div class="flex items-center gap-2">
<span class="text-primary font-extrabold tracking-tighter text-2xl">FARM</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md px-8 flex flex-col items-center flex-grow justify-center text-center">
<!-- Animated Editorial Moment -->
<div class="space-y-4 mb-8">
<h1 class="text-on-surface text-4xl font-extrabold tracking-tight">
                Entra in FARM
            </h1>
<p class="text-on-surface-variant text-md font-medium leading-relaxed">
                Gestisci il tuo futuro finanziario, un passo alla volta.
            </p>
</div>

<!-- Login/Register Form -->
<form action="/login" method="POST" class="w-full space-y-4" id="authForm">
    <div class="space-y-2 text-left">
        <label for="username" class="font-label text-xs font-bold uppercase tracking-widest text-primary">Username</label>
        <input type="text" name="username" id="username" required
               class="w-full bg-surface-container-low border-none rounded-xl px-6 py-4 text-on-surface focus:ring-2 focus:ring-primary/20 transition-all"
               placeholder="Il tuo nome">
    </div>
    <div class="space-y-2 text-left">
        <label for="password" class="font-label text-xs font-bold uppercase tracking-widest text-primary">Password</label>
        <input type="password" name="password" id="password" required
               class="w-full bg-surface-container-low border-none rounded-xl px-6 py-4 text-on-surface focus:ring-2 focus:ring-primary/20 transition-all"
               placeholder="••••••••">
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <p class="text-error text-sm font-bold">{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="pt-4 flex flex-col gap-4">
        <button type="submit" class="w-full bg-primary text-on-primary py-5 rounded-full text-lg font-bold shadow-[0_20px_40px_rgba(69,102,70,0.15)] active:scale-95 transition-all duration-200 hover:opacity-90">
            Accedi
        </button>
        <button type="button" onclick="toggleRegister()" class="text-primary font-bold text-sm uppercase tracking-widest hover:opacity-80">
            Oppure Registrati
        </button>
    </div>
</form>

<script>
    function toggleRegister() {
        const form = document.getElementById('authForm');
        const submitBtn = form.querySelector('button[type="submit"]');
        const toggleBtn = form.querySelector('button[type="button"]');
        const title = document.querySelector('h1');

        if (form.action.endsWith('/login')) {
            form.action = '/register';
            submitBtn.textContent = 'Registrati';
            toggleBtn.textContent = 'Hai già un account? Accedi';
            title.textContent = 'Unisciti a FARM';
        } else {
            form.action = '/login';
            submitBtn.textContent = 'Accedi';
            toggleBtn.textContent = 'Oppure Registrati';
            title.textContent = 'Entra in FARM';
        }
    }
</script>
</main>
<!-- Decorative Background Elements (Organic Blob/Greenhouse Aesthetics) -->
<div class="fixed top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary/5 rounded-full blur-[100px] -z-10 pointer-events-none"></div>
<div class="fixed bottom-[-5%] left-[-5%] w-[400px] h-[400px] bg-primary-container/10 rounded-full blur-[80px] -z-10 pointer-events-none"></div>
</body></html>
