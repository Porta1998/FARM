<!DOCTYPE html>
<html class="light" lang="it"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Manrope', sans-serif; background-color: #faf9f6; }
</style>
</head>
<body class="bg-[#faf9f6] text-[#2f3430] min-h-screen flex flex-col items-center justify-center p-6">
<header class="w-full flex justify-center mb-12">
<span class="text-[#456646] font-extrabold tracking-tighter text-2xl">FARM</span>
</header>
<main class="w-full max-w-md text-center">
<div class="space-y-4 mb-8">
<h1 class="text-4xl font-extrabold tracking-tight">Entra in FARM</h1>
<p class="text-on-surface-variant text-md font-medium leading-relaxed">Gestisci il tuo futuro finanziario, un passo alla volta.</p>
</div>
<form action="/login" method="POST" class="w-full space-y-4" id="authForm">
    <div class="space-y-2 text-left">
        <label for="username" class="font-label text-xs font-bold uppercase tracking-widest text-[#456646]">Username</label>
        <input type="text" name="username" id="username" required class="w-full bg-white border-none rounded-xl px-6 py-4 text-on-surface focus:ring-2 focus:ring-[#456646]/20 shadow-sm" placeholder="Il tuo nome">
    </div>
    <div class="space-y-2 text-left">
        <label for="password" class="font-label text-xs font-bold uppercase tracking-widest text-[#456646]">Password</label>
        <input type="password" name="password" id="password" required class="w-full bg-white border-none rounded-xl px-6 py-4 text-on-surface focus:ring-2 focus:ring-[#456646]/20 shadow-sm" placeholder="••••••••">
    </div>
    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for message in messages %}<p class="text-red-500 text-sm font-bold">{{ message }}</p>{% endfor %}{% endif %}
    {% endwith %}
    <div class="pt-4 flex flex-col gap-4">
        <button type="submit" class="w-full bg-[#456646] text-white py-5 rounded-full text-lg font-bold shadow-lg active:scale-95 transition-all">Accedi</button>
        <button type="button" onclick="toggleRegister()" class="text-[#456646] font-bold text-sm uppercase tracking-widest hover:opacity-80">Oppure Registrati</button>
    </div>
</form>
</main>
<script>
    function toggleRegister() {
        const form = document.getElementById('authForm');
        const submitBtn = form.querySelector('button[type="submit"]');
        const toggleBtn = form.querySelector('button[type="button"]');
        const title = document.querySelector('h1');
        if (form.action.endsWith('/login')) {
            form.action = '/register';
            submitBtn.textContent = 'Registrati';
            toggleBtn.textContent = 'Hai già un account? Accedi';
            title.textContent = 'Unisciti a FARM';
        } else {
            form.action = '/login';
            submitBtn.textContent = 'Accedi';
            toggleBtn.textContent = 'Oppure Registrati';
            title.textContent = 'Entra in FARM';
        }
    }
</script>
</body></html>
