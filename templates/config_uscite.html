<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="bg-[#faf9f6] p-6">
<form action="/config-uscite" method="POST">

        <input type="number" name="affitto" class="w-full p-4 rounded-xl border-none shadow-sm" value="0">
    </div>
    <div>

</form>
</body></html>
