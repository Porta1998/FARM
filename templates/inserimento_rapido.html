<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="bg-[#faf9f6] p-6 pb-32">
<form action="/insert" method="POST">
    <h1 class="text-2xl font-bold mb-8">Inserimento Rapido</h1>
    <div class="bg-white p-8 rounded-xl shadow-sm mb-8">
        <label class="block text-[10px] font-bold opacity-50 uppercase">Importo</label>
        <div class="flex items-baseline gap-2">
            <span class="text-4xl font-black" id="disp">-0</span>
            <input type="hidden" name="amount" id="amt" value="0">
            <input type="hidden" name="type" id="tp" value="expense">
        </div>
    </div>

    <div class="grid grid-cols-3 gap-4 mb-8">
        {% for i in range(1, 10) %}
        <button type="button" onclick="add('{{ i }}')" class="bg-white p-6 rounded-xl font-bold shadow-sm">{{ i }}</button>
        {% endfor %}
        <button type="button" onclick="add('.')" class="bg-white p-6 rounded-xl font-bold shadow-sm">,</button>
        <button type="button" onclick="add('0')" class="bg-white p-6 rounded-xl font-bold shadow-sm">0</button>
        <button type="button" onclick="back()" class="bg-white p-6 rounded-xl font-bold shadow-sm">←</button>
    </div>

    <select name="category" class="w-full p-4 rounded-xl border-none shadow-sm mb-8">
        <option>Caffè</option>
        <option>Pranzo</option>
        <option>Spesa</option>
        <option>Trasporti</option>
        <option>Altro</option>
    </select>

    <button type="submit" class="w-full bg-[#456646] text-white py-5 rounded-full font-bold">Conferma</button>
</form>
<nav class="fixed bottom-0 left-0 w-full bg-white/80 backdrop-blur-md p-6 flex justify-around border-t">
    <a href="/" class="opacity-40">Dashboard</a>
    <a href="/insert" class="font-bold text-[#456646]">Inserimento</a>
    <a href="/simulatore" class="opacity-40">Simulatore</a>
</nav>
<script>
    let val = "0";
    function add(n) {
        if (val === "0") val = n;
        else val += n;
        document.getElementById('disp').textContent = "-" + val;
        document.getElementById('amt').value = val;
    }
    function back() {
        val = val.slice(0, -1);
        if (val === "") val = "0";
        document.getElementById('disp').textContent = "-" + val;
        document.getElementById('amt').value = val;
    }
</script>
</body></html>
